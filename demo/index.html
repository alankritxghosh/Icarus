<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icarus — ask the codebase</title>
<style>
  :root{
    --paper:#F7F6F2; --card:#FFFFFF; --ink:#16181D; --muted:#6B7280; --line:#16181D;
    --hair:#E4E2DB; --accent:#2F6BFF; --grounded:#0F7B53; --unknown:#9A6B00; --danger:#B23A2E;
    --mono:"Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);}
  .app{display:flex;min-height:100vh;}
  /* sidebar */
  .sidebar{width:240px;flex:none;border-right:1.5px solid var(--line);padding:22px 18px;display:flex;flex-direction:column;gap:22px;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:18px;letter-spacing:.01em;}
  .mark{display:inline-flex;align-items:flex-end;gap:2px;height:22px;}
  .mark i{width:3px;background:var(--ink);border-radius:1px;}
  .mark .b1{height:11px}.mark .b2{height:18px}.mark .stem{height:22px;background:var(--accent)}.mark .b4{height:14px}.mark .b5{height:8px}
  .navlabel{font:600 11px var(--sans);letter-spacing:.10em;text-transform:uppercase;color:var(--muted);}
  nav{display:flex;flex-direction:column;gap:4px;}
  nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:14px;border:1.5px solid transparent;}
  nav a.active{border-color:var(--line);background:#fff;box-shadow:3px 3px 0 var(--line);}
  nav a:hover:not(.active){background:#EFEEE8;}
  .trust{margin-top:auto;font:600 12px var(--mono);color:var(--grounded);display:flex;align-items:center;gap:7px;border:1.5px solid var(--grounded);border-radius:4px;padding:8px 10px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--grounded);}
  .repo-active{font:600 13px var(--mono);word-break:break-all;margin:4px 0 8px;}
  .repo-form{display:flex;gap:6px;}
  #repo{flex:1;min-width:0;padding:7px 9px;border:1.5px solid var(--line);border-radius:4px;background:#fff;font:12px var(--mono);}
  #repo:focus{outline:none;box-shadow:2px 2px 0 var(--accent);}
  #connect-btn{padding:7px 10px;border:1.5px solid var(--line);border-radius:4px;background:#fff;font:600 12px var(--sans);cursor:pointer;box-shadow:2px 2px 0 var(--line);}
  #connect-btn:active{transform:translate(2px,2px);box-shadow:none;}
  #connect-btn:disabled{opacity:.5;cursor:default;}
  .repo-status{font:11px var(--mono);color:var(--muted);margin-top:7px;min-height:14px;}
  .repo-status.indexing{color:var(--accent);}
  .repo-status.error{color:var(--danger);}
  /* main */
  .canvas{flex:1;min-width:0;padding:34px 40px 80px;max-width:920px;}
  h1{font-size:26px;font-weight:650;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px;}
  .composer{display:flex;gap:10px;margin-bottom:26px;}
  #question{flex:1;padding:13px 15px;border:1.5px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font-size:16px;font-family:var(--sans);}
  #question:focus{outline:none;box-shadow:3px 3px 0 var(--accent);}
  #ask{padding:13px 22px;border:1.5px solid var(--line);border-radius:4px;background:var(--accent);color:#fff;font-weight:650;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 var(--line);}
  #ask:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line);}
  #ask:disabled{opacity:.5;cursor:default;}
  .label{font:600 11px var(--sans);letter-spacing:.10em;text-transform:uppercase;margin:0 0 10px;}
  .block{border:1.5px solid var(--line);border-radius:4px;background:var(--card);box-shadow:5px 5px 0 var(--line);padding:22px 24px;}
  .answer-prose{font-size:18px;line-height:1.55;margin:0 0 18px;white-space:pre-wrap;}
  .answer-prose code{font-family:var(--mono);font-size:.92em;background:#EFEEE8;padding:1px 5px;border-radius:3px;}
  .evidence{border:1.5px solid var(--line);border-radius:4px;background:var(--paper);padding:14px 16px;}
  .cites{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:13px;border:1.5px solid var(--line);border-radius:4px;padding:5px 10px;background:#fff;color:var(--ink);text-decoration:none;}
  .chip:hover{box-shadow:2px 2px 0 var(--accent);}
  .chip .src{font:600 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--ink);padding:1px 5px;border-radius:3px;}
  .chip.pr .src{background:var(--accent)} .chip.issue .src{background:var(--unknown)} .chip.code .src{background:var(--grounded)}
  .searched-line{margin-top:14px;font-size:13px;color:var(--muted);font-family:var(--mono);}
  /* unknown hero */
  .unknown{border:1.5px solid var(--line);border-radius:4px;background:#FBF7EC;box-shadow:5px 5px 0 var(--line);padding:30px 32px;}
  .unknown .label{color:var(--unknown);}
  .unknown h2{font-size:30px;font-weight:650;margin:0 0 10px;line-height:1.15;}
  .unknown p{color:var(--muted);font-size:15px;margin:0 0 18px;max-width:520px;}
  .searched-box{border:1.5px solid var(--line);border-radius:4px;background:#fff;padding:12px 14px;max-width:560px;}
  .searched-box .k{font:600 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .searched-box .v{font-family:var(--mono);font-size:13px;color:var(--ink);margin-top:6px;line-height:1.8;word-break:break-word;}
  .actions{display:flex;gap:10px;margin-top:18px;}
  .ghost{font:600 13px var(--sans);border:1.5px solid var(--line);border-radius:4px;background:#fff;padding:9px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--line);}
  .ghost:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line);}
  .muted{color:var(--muted);}
  .repo-panel{border:1.5px solid var(--line);border-radius:4px;padding:14px 16px;margin:0 0 20px;background:#fff;}
  .repo-panel .row{font:12px var(--mono);color:var(--ink);margin:0 0 7px;display:flex;gap:8px;align-items:baseline;}
  .repo-panel .row:last-child{margin-bottom:0;}
  .repo-panel .tag{font:600 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--ink);padding:1px 6px;border-radius:3px;flex:none;}
  .repo-panel .tag.ok{background:var(--grounded);}
  .repo-panel .tag.stale{background:var(--accent);}
  /* Unknown is its own colour on purpose: it must not look like either good
     news or an error. "I could not check" is a third state, not a failure. */
  .repo-panel .tag.unknown{background:var(--unknown);}
  .repo-panel .arrangement{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .repo-panel .parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .repo-panel .part{font:11px var(--mono);border:1.5px solid var(--line);border-radius:4px;padding:3px 8px;}
  .repo-panel .note{font:11px var(--mono);color:var(--muted);margin-top:8px;}
  .skel{height:13px;background:#E4E2DB;border-radius:3px;margin:9px 0;}
  .err{border-color:var(--danger);box-shadow:5px 5px 0 var(--danger);}
  .err .label{color:var(--danger);}
  .recent{margin-top:30px;border-top:1.5px solid var(--hair);padding-top:14px;}
  .recent .row{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--muted);padding:5px 0;}
  .tag-cited{color:var(--grounded);font-family:var(--mono);font-size:12px;}
  .tag-unknown{color:var(--unknown);font-family:var(--mono);font-size:12px;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="stem"></i><i class="b4"></i><i class="b5"></i></span>
      Icarus
    </div>
    <div>
      <div class="navlabel">ask repo</div>
      <nav>
        <span class="active">Home</span>
      </nav>
    </div>
    <div>
      <div class="navlabel">active repo</div>
      <div class="repo-active" id="active-repo">—</div>
      <form id="repo-form" class="repo-form">
        <input id="repo" name="repo" autocomplete="off" placeholder="owner/repo" />
        <button id="connect-btn" type="submit">Connect</button>
      </form>
      <div class="repo-status" id="connect-status"></div>
    </div>
    <div id="auth-area">
      <div id="signed-out">
        <button id="signin-btn" class="ghost" style="width:100%">Sign in with GitHub</button>
        <!-- Public only, and that is now enforced: the WEB login asks for
             read:user, not repo (demo/github_oauth.py, 2026-07-27), so this
             surface cannot read a private repo even if you name one. The Mac
             app and extension still ask for `repo` and connect private ones. -->
        <div class="repo-status muted" style="margin-top:8px">Sign in to connect any public repo. Private repos need the Mac app.</div>
      </div>
      <div id="signed-in" style="display:none">
        <div class="navlabel">signed in</div>
        <div id="tier-badge" class="trust"><span class="dot"></span> 0 trained on your code</div>
        <button id="signout-btn" class="ghost" style="width:100%;margin-top:8px">Sign out</button>
      </div>
    </div>
  </aside>

  <main class="canvas">
    <h1>Ask the codebase</h1>
    <p class="sub" id="sub">Answers come only from what was written down — with proof, or an honest “no one wrote this down.”</p>

    <!-- What Icarus knows about this repo BEFORE anyone asks: what changed
         since you were last here, whether the index still matches the
         repository, and how the code is arranged. Every one of these can be
         UNKNOWN, and each renders that as unknown rather than as good news --
         see renderRepoPanel(). -->
    <section id="repo-panel" class="repo-panel" style="display:none"></section>

    <form id="form" class="composer">
      <input id="question" name="question" autocomplete="off" placeholder="Why was it built this way?" />
      <button id="ask" type="submit">Ask</button>
    </form>

    <section id="result"></section>
  </main>
</div>

<script>
const form=document.getElementById("form");
const input=document.getElementById("question");
const ask=document.getElementById("ask");
const result=document.getElementById("result");

const TOKEN_KEY="icarus.token";
function getToken(){return sessionStorage.getItem(TOKEN_KEY)||"";}
function setToken(t){t?sessionStorage.setItem(TOKEN_KEY,t):sessionStorage.removeItem(TOKEN_KEY);}
function authHeaders(extra){
  const h=Object.assign({},extra||{});
  const t=getToken();
  if(t)h["Authorization"]="Bearer "+t;
  return h;
}

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function srcOf(ref){const p=(ref||"").split(":")[0];return ["pr","issue","code"].includes(p)?p:"ref";}

function renderAnswer(p){
  const chips=p.citations.map(c=>{
    const s=srcOf(c.ref);
    const inner=`<span class="src">${esc(s)}</span>${esc(c.ref)}`;
    return c.url
      ? `<a class="chip ${s}" href="${esc(c.url)}" target="_blank" rel="noopener">${inner}</a>`
      : `<span class="chip ${s}">${inner}</span>`;
  }).join("");
  const n=p.searched.length;
  result.innerHTML=
    `<div class="block">
       <p class="label" style="color:var(--grounded)">grounded answer</p>
       <div class="answer-prose">${esc(p.answer)}</div>
       <div class="evidence">
         <p class="label" style="margin:0;color:var(--muted)">evidence — one glance away</p>
         <div class="cites">${chips}</div>
       </div>
       <div class="searched-line">searched ${n} source${n===1?"":"s"} · all of them shown</div>
     </div>`;
}

function renderUnknown(p){
  // Split what the QUESTION named from what search suggested. A flat list made a
  // refusal that looked up the named ref FIRST read as one that ignored the
  // question (reported live 2026-07-28). Everything is still listed.
  const named=p.anchored||[];
  const rest=p.searched.filter(r=>!named.includes(r));
  const namedBox=named.length
    ? `<div class="searched-box" style="margin-bottom:8px"><span class="k">you named</span><div class="v">${esc(named.join(" · "))}</div></div>`
    : "";
  const list=rest.length?esc(rest.join(" · ")):"—";
  // While the index is still building, an abstention means "I haven't finished
  // reading" — a different claim from "no one wrote this down", and only the
  // second one is a statement about the repo. Never show the hero for the first.
  const head = p.indexing
    ? `<p class="label">still indexing</p>
       <h2>I haven’t finished reading this repo.</h2>
       <p>Search is running on keywords only until indexing finishes — ask again shortly.</p>`
    : `<p class="label">honest answer</p>
       <h2>No one wrote this down.</h2>
       <p>The evidence doesn’t record a reason, so Icarus won’t invent one.</p>`;
  result.innerHTML=
    `<div class="unknown">
       ${head}
       ${namedBox}
       <div class="searched-box"><span class="k">${named.length?"then searched":"searched"}</span><div class="v">${list}</div></div>
     </div>`;
}

function renderLoading(){
  result.innerHTML=
    `<div class="block">
       <p class="label muted">thinking…</p>
       <div class="skel" style="width:88%"></div>
       <div class="skel" style="width:70%"></div>
       <div class="skel" style="width:80%"></div>
     </div>`;
}

function renderError(){
  result.innerHTML=
    `<div class="block err"><p class="label">couldn’t reach the brain</p>
       <div class="muted">The Icarus server isn’t responding. Is <code>demo.server</code> running?</div></div>`;
}

form.addEventListener("submit",async(e)=>{
  e.preventDefault();
  const question=input.value.trim();
  if(!question)return;
  ask.disabled=true; renderLoading();
  try{
    const resp=await fetch("/ask",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({question})});
    if(resp.status===401){setToken("");renderAuthState();ask.disabled=false;return;}
    const p=await resp.json();
    if(p.verdict==="answer")renderAnswer(p); else renderUnknown(p);
  }catch(err){renderError();}
  finally{ask.disabled=false;}
});

const activeRepo=document.getElementById("active-repo");
const repoForm=document.getElementById("repo-form");
const repoInput=document.getElementById("repo");
const connectBtn=document.getElementById("connect-btn");
const connectStatus=document.getElementById("connect-status");
const sub=document.getElementById("sub");

function setStatus(msg,cls){connectStatus.className="repo-status"+(cls?" "+cls:"");connectStatus.textContent=msg||"";}

async function refreshStatus(){
  try{const s=await (await fetch("/status",{headers:authHeaders()})).json();
    if(s.repo)activeRepo.textContent=s.repo;
    return s;
  }catch(e){return null;}
}

const repoPanel=document.getElementById("repo-panel");

function ago(ts){
  if(!ts)return "";
  const s=Math.max(0,Date.now()/1000-ts);
  if(s<90)return "just now";
  if(s<5400)return Math.round(s/60)+" min ago";
  if(s<172800)return Math.round(s/3600)+" hours ago";
  return Math.round(s/86400)+" days ago";
}

// --- the three "before you ask" rows -----------------------------------
// Each one can be UNKNOWN, and each renders unknown as UNKNOWN. A failed
// check that reads as "you're up to date" or "nothing changed" is the same
// class of failure as a bluffed citation: a confident claim the evidence does
// not support. That is why there is no `|| 0` or `|| false` anywhere below.

function freshnessRow(f){
  if(!f)return "";
  if(f.pinned){
    // Frozen deliberately (the reproducible eval board). Showing the raw
    // "68 commits behind" here would describe a decision as neglect and
    // offer a refresh that is forbidden by design.
    const n=typeof f.behind_by==="number"?f.behind_by:null;
    return `<div class="row"><span class="tag">pinned</span><span>Built-in demo corpus, frozen on purpose${
      n===null?"":" — "+n.toLocaleString()+" commits behind upstream"}.</span></div>`;
  }
  if(f.up_to_date===true)
    return `<div class="row"><span class="tag ok">index</span><span>Matches the repository${f.checked_at?" · checked "+ago(f.checked_at):""}.</span></div>`;
  if(f.up_to_date===false){
    const n=typeof f.behind_by==="number"?f.behind_by:null;
    return `<div class="row"><span class="tag stale">index</span><span>${
      n===null?"Behind the repository — Icarus couldn’t work out by how much"
             :n.toLocaleString()+" commit"+(n===1?"":"s")+" behind the repository"}${
      f.checked_at?" · checked "+ago(f.checked_at):""}. Reconnect with refresh to re-read it.</span></div>`;
  }
  return `<div class="row"><span class="tag unknown">index</span><span>Icarus couldn’t check whether this index is current. It may or may not be.</span></div>`;
}

function briefingRow(b){
  if(!b)return "";
  if(b.first_visit)
    return `<div class="row"><span class="tag">first visit</span><span>First time you’ve looked at this repository here.</span></div>`;
  const n=b.commits_since;
  const when=b.last_visit_at?" ("+ago(b.last_visit_at)+")":"";
  if(n===null||n===undefined)
    return `<div class="row"><span class="tag unknown">since</span><span>You were last here${when}, but Icarus couldn’t work out what has changed since.</span></div>`;
  if(n===0)
    return `<div class="row"><span class="tag ok">since</span><span>Nothing has changed since you were last here${when}.</span></div>`;
  return `<div class="row"><span class="tag stale">since</span><span>${n.toLocaleString()} commit${n===1?"":"s"} since you were last here${when}.</span></div>`;
}

function arrangementRow(st){
  if(!st)return "";
  const parts=(st.components||[]).slice(0,6).map(c=>
    `<span class="part">${esc(c.path)}<span class="muted"> ←${c.depended_on_by.length}</span></span>`).join("");
  const core=(st.most_depended_on_files||[]).slice(0,4).map(f=>
    `<span class="part">${esc(f.path)}<span class="muted"> ←${f.depended_on_by_count}</span></span>`).join("");
  const unanalysed=(st.unanalysed_languages||[]);
  if(!parts&&!core){
    // Nothing found is NOT the same as nothing there, and the difference is
    // the whole honesty of this row.
    return `<div class="arrangement"><p class="label" style="margin:0;color:var(--muted)">how the code is arranged</p>
      <div class="note">${unanalysed.length
        ? "Icarus does not analyse "+esc(unanalysed.join(", "))+" imports, so it did not look for structure here — this is not a claim that there is none."
        : "No internal imports resolved, so Icarus has nothing to show. That can be true of a project whose code lives in one flat package."}</div></div>`;
  }
  return `<div class="arrangement">
    <p class="label" style="margin:0;color:var(--muted)">how the code is arranged · read from its own imports</p>
    ${parts?`<div class="parts">${parts}</div>`:""}
    ${core?`<div class="note" style="margin-top:9px">most depended on</div><div class="parts">${core}</div>`:""}
    ${unanalysed.length?`<div class="note">Not analysed: ${esc(unanalysed.join(", "))} — no claim is made about those.</div>`:""}
  </div>`;
}

async function renderRepoPanel(status){
  if(!status||!status.repo){repoPanel.style.display="none";return;}
  let briefing=null,map=null;
  // Both are extras. Neither may break the page it decorates.
  try{const r=await fetch("/briefing",{headers:authHeaders()});if(r.ok)briefing=await r.json();}catch(e){}
  try{const r=await fetch("/map",{headers:authHeaders()});if(r.ok)map=await r.json();}catch(e){}
  const html=briefingRow(briefing)+freshnessRow(status.freshness)
            +arrangementRow(map&&map.indexed_structure);
  repoPanel.innerHTML=html;
  repoPanel.style.display=html?"block":"none";
}

repoForm.addEventListener("submit",async(e)=>{
  e.preventDefault();
  const repo=repoInput.value.trim();
  if(!repo)return;
  connectBtn.disabled=true; ask.disabled=true;
  setStatus("indexing "+repo+" …","indexing");
  try{
    const r=await fetch("/connect",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({repo})});
    if(r.status===401){setStatus("sign in first","error");connectBtn.disabled=false;ask.disabled=false;return;}
    if(r.status===400){setStatus((await r.json()).error||"bad repo","error");connectBtn.disabled=false;ask.disabled=false;return;}
    // Matches the server's own embed timeout (evals/retriever.py's
    // SemanticRetriever, demo/library.py's _EMBED_TIMEOUT_SECONDS = 900) so
    // the UI doesn't give up on a connect that's still legitimately working
    // server-side. If we DO give up, say so -- never leave "indexing …" up
    // forever with no explanation (a real bug this session found live).
    let settled=false;
    for(let i=0;i<900;i++){
      await new Promise(res=>setTimeout(res,1000));
      const s=await refreshStatus();
      if(!s)continue;
      // How far in, and roughly how long -- a connect runs for minutes
      // (measured 185s to 987s on real repos) and a bare "indexing …" cannot
      // be told apart from a hang. Absent when the brain has nothing real to
      // report; never a fabricated 0%.
      const p=s.indexing_progress;
      if(p&&p.total>0&&s.state!=="ready"){
        const n=x=>x.toLocaleString();
        const eta=p.eta_seconds>0
          ? (p.eta_seconds<60?" · about "+p.eta_seconds+" sec left"
                             :" · about "+Math.round(p.eta_seconds/60)+" min left")
          : "";
        setStatus("indexing "+repo+" — read "+n(p.done)+" of "+n(p.total)+eta,"indexing");
      }
      if(s.state==="ready"&&s.repo===repo){setStatus("connected · "+repo,"");sub.textContent="Now answering about "+repo+" — with proof, or an honest “no one wrote this down.”";result.innerHTML="";renderRepoPanel(s);settled=true;break;}
      if(s.state==="error"){setStatus(s.error||"indexing failed","error");settled=true;break;}
    }
    if(!settled){setStatus("timed out indexing "+repo+" — try again","error");}
  }catch(err){setStatus("couldn’t reach the server","error");}
  finally{connectBtn.disabled=false;ask.disabled=false;}
});

const signedOut=document.getElementById("signed-out");
const signedIn=document.getElementById("signed-in");
const tierBadge=document.getElementById("tier-badge");

function renderAuthState(){
  const on=!!getToken();
  signedOut.style.display=on?"none":"block";
  signedIn.style.display=on?"block":"none";
  if(!on){activeRepo.textContent="—";setStatus("");repoPanel.style.display="none";}
}

document.getElementById("signin-btn").addEventListener("click",async()=>{
  try{
    const r=await fetch("/auth/github/begin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"web"})});
    const {authorize_url}=await r.json();
    window.location.assign(authorize_url);
  }catch(e){setStatus("couldn't start sign-in","error");}
});

document.getElementById("signout-btn").addEventListener("click",()=>{
  setToken(""); renderAuthState(); window.location.assign("/");
});

// On return from GitHub the brain redirects to /?session=... — redeem it once,
// keep the token in sessionStorage, and scrub it from the visible URL.
async function redeemFromUrl(){
  const p=new URLSearchParams(window.location.search);
  const session=p.get("session");
  if(!session)return;
  try{
    const r=await fetch("/auth/github/redeem",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session})});
    if(r.ok){const {token}=await r.json();setToken(token);}
  }catch(e){/* fall through to signed-out */}
  history.replaceState({},document.title,"/");
}

async function refreshBadge(){
  if(!getToken())return;
  try{
    const s=await (await fetch("/status",{headers:authHeaders()})).json();
    if(s&&s.state==="ready"&&s.repo){
      tierBadge.innerHTML='<span class="dot"></span> public repository alpha';
    }
  }catch(e){}
}

(async()=>{ await redeemFromUrl(); renderAuthState(); const s=await refreshStatus(); await refreshBadge(); await renderRepoPanel(s); })();
</script>
