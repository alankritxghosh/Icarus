<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<style>
  :root {
    --card: #15151A; --ink: #ECEAE3; --muted: #948F86; --hair: #26262C;
    --signal: #8098FF; --cited: #6FD3A8; --unknown: #E0A23C;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono: "SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: #000; overflow: hidden; }
  #root { position: relative; width: 1920px; height: 1080px; font-family: var(--serif); color: var(--ink);
    background: radial-gradient(120% 90% at 50% 6%, #17141d 0%, #0d0d12 44%, #08080c 80%, #050507 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased; }
  #glow { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(38% 34% at 50% 34%, rgba(128,152,255,.18), transparent 70%); }
  #vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(135% 135% at 50% 46%, transparent 64%, rgba(0,0,0,.34) 90%, rgba(0,0,0,.62) 100%); }
  .mark { width: 260px; height: 260px; color: var(--signal); overflow: visible; margin-bottom: 6px; }
  .mark path, .mark use { fill: currentColor; }
  .name { font-size: 150px; letter-spacing: .02em; line-height: 1; }
  .line { margin-top: 14px; font-size: 78px; color: var(--ink); }
  .chips { margin-top: 54px; display: flex; gap: 26px; align-items: center; }
  .chip { font-family: var(--mono); font-size: 30px; padding: 12px 26px; border-radius: 999px; font-weight: 600; }
  .chip.c { color: var(--cited);   background: rgba(111,211,168,.12); border: 1px solid rgba(111,211,168,.4); }
  .chip.u { color: var(--unknown); background: rgba(224,162,60,.10);  border: 1px solid rgba(224,162,60,.4); }
  .foot { margin-top: 46px; font-family: var(--mono); font-size: 30px; color: var(--muted); letter-spacing: .04em; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-duration="1">
  <div id="glow"></div>
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <g fill="currentColor">
      <path id="w" d="M49 54 Q65.73 51.58 80.98 55.12 Q65.6 55.48 49 54 Z M49 54 Q67.95 48.76 86.05 50.63 Q68.36 53.29 49 54 Z M49 54 Q69.67 45.36 90.41 44.9 Q70.79 50.44 49 54 Z M49 54 Q70.81 41.46 93.84 38.03 Q72.77 46.97 49 54 Z M49 54 Q71.25 37.16 96.13 30.19 Q74.18 42.96 49 54 Z M49 54 Q70.93 32.58 97.08 21.57 Q74.93 38.5 49 54 Z M49 54 L97.08 21.57 Q81.83 39.32 80.77 45.96 Z"/>
      <use href="#w" transform="translate(100,0) scale(-1,1)"/>
      <path d="M42 46 L49.3 46 L49.3 72 Z M58 46 L50.7 46 L50.7 72 Z"/>
    </g>
  </svg>
  <div class="name">Icarus.</div>
  <div class="line">It won't bluff.</div>
  <div class="chips">
    <div class="chip c">cited</div>
    <div class="chip u">no one wrote this down</div>
  </div>
  <div class="foot">the engineering brain that answers only from evidence</div>
  <div id="vig"></div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.set("#root", { opacity: 1 }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</div>
</body>
</html>
