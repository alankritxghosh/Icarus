name: security

# Backstop for the local pre-commit hook: on every push/PR, block on a committed
# secret and run the full test suite + Swift build.
on:
  push:
    branches: [main, mac-app]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for secrets (blocking)
        run: bash scripts/scan_secrets.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests (evals + demo)
        run: |
          python3 -m unittest discover -t . -s evals
          python3 -m unittest discover -t . -s demo

  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # The app targets Swift 6 (Package.swift swift-tools-version 6.0 + Swift-6
      # actor-isolation inference across the SwiftUI views). The macos-14 image's
      # DEFAULT Xcode is 15.x / Swift 5.10, which fails at the tools-version gate
      # -- so select the newest Xcode 16.x (Swift 6) actually installed on the
      # runner. Keeps the project at 6.0 rather than downgrading the whole app.
      - name: Select Xcode 16 (Swift 6)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build + test the Mac app
        working-directory: mac/Icarus
        run: |
          swift --version
          swift build
          swift test
