name: security

# Backstop for the local pre-commit hook: on every push/PR, block on a committed
# secret and run the full test suite + Swift build.
on:
  push:
    branches: [main, mac-app]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan tracked files for secrets (blocking)
        run: bash scripts/scan_secrets.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python tests (evals + demo)
        run: |
          python3 -m unittest discover -t . -s evals
          python3 -m unittest discover -t . -s demo
      # The index is what lets a reader -- human or coding agent -- reference
      # real names instead of guessing. Unchecked it rotted to 31 of 52 modules
      # and three functions that do not exist. --selftest first, because a
      # checker that cannot fail is worse than none.
      - name: detailed_index.md matches the code
        run: |
          python3 scripts/check_detailed_index.py --selftest
          python3 scripts/check_detailed_index.py

  swift:
    # macos-15 for its Xcode 16.3+/Swift 6.1 toolchain: the app targets Swift 6
    # (Package.swift 6.0 + Swift-6 actor-isolation across the SwiftUI views) AND
    # the pinned KeyboardShortcuts 2.4.0 requires swift-tools 6.1. macos-14's
    # default Xcode 15.x/Swift 5.10 fails the tools-version gate; its newest
    # Xcode 16.0.3/Swift 6.0.3 is still < the dependency's 6.1. Select the newest
    # Xcode 16.x on the runner explicitly rather than trust the image default.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select newest Xcode 16 (Swift 6.1)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build + test the Mac app
        working-directory: mac/Icarus
        run: |
          swift --version
          swift build
          swift test
