# Icarus brain — build the container and redeploy the Azure Container App.
#
# Push to main -> secrets scan + full Python suites -> docker build -> push to
# ACR -> `az containerapp update`. Deploy runs only if the tests pass, because
# every redeploy drops every connected session (Azure storage is ephemeral);
# shipping a red build costs users their session for nothing.
#
# ACR Tasks is disabled on this registry, so the runner does the docker build
# itself rather than calling `az acr build`.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables), all Masked +
# Protected, from one service principal with AcrPush on the registry and
# Contributor on the container app:
#   AZURE_CLIENT_ID  AZURE_CLIENT_SECRET  AZURE_TENANT_ID

stages: [test, build, package, deploy]

# The only paths that can change the shipped image — everything else
# (docs/, site/, mac/, extension/) is excluded by .dockerignore, so a commit
# touching just those would rebuild a byte-identical image. Both `build` and
# `deploy` gate on this: skipping the build but leaving the deploy clickable
# would offer to deploy a tag that was never pushed.
.image_sources: &image_sources
  - Dockerfile
  - requirements.txt
  - evals/**/*
  - demo/**/*
  - .gitlab-ci.yml

variables:
  ACR: caec8849f1f0acr
  IMAGE: caec8849f1f0acr.azurecr.io/icarus-brain
  APP: icarus-brain
  RESOURCE_GROUP: icarus-rg

secrets-scan:
  stage: test
  image: alpine:3.20
  before_script: [apk add --no-cache bash git grep]
  script: bash scripts/scan_secrets.sh

tests:
  stage: test
  # Not -slim: test_egress_invariants shells out to `git` to prove the per-user
  # private tree is ignored, and slim ships no git.
  image: python:3.12
  script:
    - python3 -m unittest discover -t . -s evals
    - python3 -m unittest discover -t . -s demo
    # See .github/workflows/security.yml for why. --selftest proves the checker
    # can fail before its pass is worth anything.
    - python3 scripts/check_detailed_index.py --selftest
    - python3 scripts/check_detailed_index.py

build:
  stage: build
  image: docker:27-cli
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    # A service principal's appId/password are valid docker credentials for ACR,
    # so the build stage needs no az CLI.
    - echo "$AZURE_CLIENT_SECRET" | docker login "$ACR.azurecr.io" -u "$AZURE_CLIENT_ID" --password-stdin
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *image_sources

# The Mac app + Sparkle. Builds Icarus.app, embeds Sparkle.framework, stamps the
# update feed (SUFeedURL/SUPublicEDKey) and the brain URL, and hands back a
# ready-to-run Icarus.dmg as an artifact. Ports .github/workflows/dmg.yml rather
# than inventing a second packaging path — package_dmg.sh is the single source
# of truth for what a build is, on either CI.
#
# WHAT THIS JOB DELIBERATELY DOES NOT DO: sign the appcast. That needs the
# private EdDSA key, which lives in one login keychain and is the entire
# security of the update path — putting it in CI variables would make
# pipeline-edit access equivalent to code execution on every installed Mac.
# So publishing stays a local `site/release-dmg.sh` step, which accepts this
# job's artifact directly (see that script's header) and re-signs the feed there.
#
# SIGNING, stated accurately. This comment used to claim the packaging script
# REFUSES an ad-hoc signature. It does not -- that refusal was deliberately
# removed in 4900025, since ad-hoc packaging is the accepted alpha model and a
# SaaS runner carries no signing identity. So this job normally produces an
# AD-HOC signed artifact, and `package_dmg.sh` now prints a "TEST ARTIFACT
# ONLY" warning saying so.
#
# What that costs: an ad-hoc signature makes the app's designated requirement
# its own cdhash, which changes on every build, so each update looks like a
# different app -- users are re-prompted for the GitHub token in their
# Keychain, and a background MCP launch can wait on an invisible prompt.
#
# The gate is therefore at PUBLISH, not here: `site/release-dmg.sh` verifies
# the signature, refuses an ad-hoc build unless given --allow-adhoc, and PINS
# the leaf certificate's SHA-256 -- a different certificate with the same
# display name changes the designated requirement and re-prompts every user,
# so matching "Icarus Self-Signed" by name is not enough. Import that exact
# identity on the runner to make this job produce a distributable artifact
# instead of a test one.
#
# Manual, and gated on mac/ changing: SaaS macOS runners bill compute minutes at
# a premium multiplier, and a Swift release build is not cheap. `needs: [tests]`
# so it starts as soon as the suites pass rather than queueing behind the image.
package-dmg:
  stage: package
  tags: [saas-macos-medium-m1]
  image: macos-15-xcode-16
  needs: [tests]
  variables:
    ICARUS_BRAIN_URL: https://icarus-brain.whitecliff-26814629.centralindia.azurecontainerapps.io
  script:
    - swift --version
    - bash mac/Icarus/scripts/package_dmg.sh
    - shasum -a 256 mac/Icarus/Icarus.dmg
    # State the identity in the log, so "why is it re-prompting for my token?"
    # is answerable from the job rather than by re-deriving it later.
    - codesign -dv --verbose=2 mac/Icarus/Icarus.app 2>&1 | grep -E "Identifier|Signature|TeamIdentifier" || true
  artifacts:
    name: "Icarus-dmg-$CI_COMMIT_SHORT_SHA"
    paths: [mac/Icarus/Icarus.dmg]
    expire_in: 30 days
    when: on_success
  rules:
    # A release tag packages automatically — that is the one time it is wanted
    # without being asked for.
    - if: $CI_COMMIT_TAG =~ /^alpha-/
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [mac/**/*]
      when: manual
      allow_failure: true

deploy:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    # Image, scale and env in ONE update: each `az containerapp update` mints a
    # new revision and every revision drops every connected session, so doing
    # these separately would cost two drops to land one change.
    #
    # --max-replicas 1: a queued ingest runs in ONE replica's memory and writes
    # to THAT container's ephemeral disk. With several replicas, the caller's
    # next /connect or /status can land on a replica that knows nothing about
    # the job and cannot see its corpus. Pinning to one makes a queued job
    # always visible to its own caller. Horizontal scaling is the deliberate
    # cost, and it is currently unused. Lift this only once the corpus lives on
    # shared persistent storage (docs/HANDOFF.md §6 phase 2).
    #
    # ICARUS_SYNC_CONNECT removed: it made /connect block on the full Stage 1
    # ingest, which Azure's fixed 240s ingress timeout then killed -- measured
    # live on astral-sh/uv 2026-08-10, which never connected at all. It existed
    # because a background thread was not reliably resourced on request-scoped
    # CPU; minReplicas=1 keeps a replica warm and the backgrounded Stage 2
    # embed already completes there, so that premise no longer holds.
    - az containerapp update --name "$APP" --resource-group "$RESOURCE_GROUP"
      --image "$IMAGE:$CI_COMMIT_SHORT_SHA"
      --min-replicas 1 --max-replicas 1
      --remove-env-vars ICARUS_SYNC_CONNECT
    - FQDN=$(az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
    # Deploy is not done until the new revision actually serves.
    - for i in $(seq 1 30); do curl -fsS "https://$FQDN/health" && exit 0; sleep 10; done; exit 1
  rules:
    # Manual gate: a redeploy drops every connected session, so it stays a
    # deliberate click rather than a side effect of any commit to main. Change
    # to `when: on_success` once a staging environment exists.
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *image_sources
      when: manual
  environment:
    name: production
    url: https://icarus-brain.whitecliff-26814629.centralindia.azurecontainerapps.io
