# Render Blueprint for the Icarus brain (free tier, Docker).
# Deploy: push this repo to GitHub, then in Render → New → Blueprint, point it at
# the repo. Set the secret values (sync:false) in the Render dashboard — never here.
#
# Cloud posture (see docs/DISTRIBUTION.md): the loopback Host guard is opened
# (ICARUS_ALLOWED_HOSTS=*) and every /ask + /connect is gated behind a real
# GitHub token (ICARUS_REQUIRE_GITHUB_AUTH=1) — that is the boundary.
#
# NOTE: the free plan sleeps after ~15 min idle; the first request then takes
# ~30-60s to wake it.
services:
  - type: web
    name: icarus-brain
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Open the Host guard; rely on the GitHub bearer gate as the real boundary.
      - key: ICARUS_ALLOWED_HOSTS
        value: "*"
      - key: ICARUS_REQUIRE_GITHUB_AUTH
        value: "1"
      # Secrets + the public URL — set these in the Render dashboard, not in git.
      # ICARUS_PUBLIC_URL must equal this service's public https URL and match the
      # GitHub OAuth app's Authorization callback URL (…/auth/github/callback).
      - key: ICARUS_PUBLIC_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # The private-repo writer -- a billing-enabled, no-training Gemini key.
      # Never satisfied by the free GEMINI_API_KEY (the trust interlock only
      # trusts this dedicated env var). See docs/plans/2026-07-04-private-repos-
      # per-user-isolation.md.
      - key: GEMINI_PAID_API_KEY
        sync: false
      # Lets the container's `gh` fetch PRs/issues when a user switches repos.
      - key: GH_TOKEN
        sync: false
      # Per-user corpora (public cache AND private code). Render's free-tier
      # disk is EPHEMERAL -- wiped on every deploy/restart/idle-sleep, so this
      # is a cache, not durable storage (decision recorded in the scoping doc).
      - key: ICARUS_STORAGE_ROOT
        value: /opt/render/project/src/data
